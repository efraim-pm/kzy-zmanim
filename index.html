<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jewish Calendar &amp; Zmanim — Kehel Zichron Yaakov</title>

  <link rel="stylesheet" href="./style.css?v=2">
  <script src="app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <h1>Jewish Calendar &amp; Zmanim</h1>
    <div class="location">Chestnut Ridge, NY</div>
    <div class="dedication">
      קהל זכרון יעקב ע״ש ר׳ יעקב דב שטרנבוך ז״ל
    </div>
  </header>

  <nav class="nav-bar" aria-label="Date navigation">
    <div class="date-nav">
      <button
        type="button"
        class="today-btn"
        onclick="goToday()"
      >
        Today
      </button>

      <button
        type="button"
        onclick="prevDay()"
        aria-label="Previous day"
      >
        ‹
      </button>

      <button
        type="button"
        onclick="nextDay()"
        aria-label="Next day"
      >
        ›
      </button>
    </div>
  </nav>

  <nav class="tab-bar" aria-label="Primary navigation">
    <div
      class="tab active"
      data-tab="zmanim"
      onclick="switchTab('zmanim')"
    >
      ☀ Zmanim
    </div>

    <div
      class="tab"
      data-tab="calendar"
      onclick="switchTab('calendar')"
    >
      🗓 Calendar
    </div>

    <div
      class="tab"
      data-tab="newsletter"
      onclick="switchTab('newsletter')"
    >
      📰 Newsletter
    </div>
  </nav>

  <main>
    <!-- =====================================================
         ZMANIM
         ===================================================== -->
    <section id="zmanim-tab" class="tab-content active">
      <div id="date-hero"></div>

      <!-- Combined compact morning and evening zmanim -->
      <section class="zmanim-section zmanim-combined">
        <h2>☀ Zmanim / זמנים</h2>

        <div class="zmanim-columns">
          <div
            id="morning-times"
            class="zmanim-list"
            aria-label="Morning zmanim"
          ></div>

          <div
            id="evening-times"
            class="zmanim-list"
            aria-label="Afternoon and evening zmanim"
          ></div>
        </div>
      </section>

      <section
        id="davening-section"
        aria-label="Davening schedule"
      ></section>
    </section>

    <!-- =====================================================
         CALENDAR
         ===================================================== -->
    <section id="calendar-tab" class="tab-content">
      <div class="calendar-nav">
        <button
          type="button"
          onclick="prevMonth()"
          aria-label="Previous month"
        >
          ‹
        </button>

        <div>
          <div id="calendar-month-title"></div>
          <div id="calendar-badge"></div>
        </div>

        <button
          type="button"
          onclick="nextMonth()"
          aria-label="Next month"
        >
          ›
        </button>
      </div>

      <div id="days-header"></div>
      <div id="calendar-grid"></div>
      <div id="calendar-agenda"></div>
    </section>

    <!-- =====================================================
         NEWSLETTER
         ===================================================== -->
    <section id="newsletter-tab" class="tab-content">
      <section class="newsletter-controls">
        <h3>Newsletter Generator</h3>
        <div id="nl-date-info"></div>

        <div class="nl-form-grid">
          <div class="nl-field">
            <label for="nl-mincha-override">
              Erev Shabbos Mincha override
            </label>
            <input
              id="nl-mincha-override"
              type="text"
              placeholder="Automatic"
            >
          </div>

          <div class="nl-field">
            <label for="nl-minchab-override">
              Shabbos Mincha B override
            </label>
            <input
              id="nl-minchab-override"
              type="text"
              placeholder="Automatic"
            >
          </div>

          <div class="nl-field">
            <label for="nl-maariv-override">
              Maariv override
            </label>
            <input
              id="nl-maariv-override"
              type="text"
              placeholder="Automatic"
            >
          </div>

          <div class="nl-field">
            <label for="nl-torahstories-override">
              Torah &amp; Stories time
            </label>
            <input
              id="nl-torahstories-override"
              type="text"
              placeholder="9:45 AM"
            >
          </div>

          <div class="nl-field">
            <label for="nl-avos-override">
              Pirkei Avos chapter
            </label>
            <input
              id="nl-avos-override"
              type="text"
              placeholder="Automatic"
            >
          </div>

          <div class="nl-field">
            <label for="nl-avosubanim-override">
              Avos Ubanim
            </label>
            <input
              id="nl-avosubanim-override"
              type="text"
            >
          </div>

          <div class="nl-field">
            <label for="nl-shiur-topic">
              Shiur topic
            </label>
            <textarea id="nl-shiur-topic"></textarea>
          </div>

          <div class="nl-field">
            <label for="nl-special-shiur">
              Special shiur or event
            </label>
            <textarea id="nl-special-shiur"></textarea>
          </div>

          <div class="nl-field">
            <label for="nl-simcha">
              Simcha announcement
            </label>
            <textarea id="nl-simcha"></textarea>
          </div>

          <div class="nl-field">
            <label for="nl-announcements">
              General announcements
            </label>
            <textarea id="nl-announcements"></textarea>
          </div>

          <div class="nl-field">
            <label for="nl-sponsors">
              Sponsors and dedications
            </label>
            <textarea id="nl-sponsors"></textarea>
          </div>

          <div class="nl-field">
            <label for="nl-seudos">
              Seudos information
            </label>
            <textarea id="nl-seudos"></textarea>
          </div>
        </div>

        <div class="nl-actions">
          <button
            type="button"
            class="btn-primary"
            onclick="renderNewsletter()"
          >
            Generate Newsletter
          </button>

          <button
            type="button"
            class="btn-secondary"
            onclick="saveNewsletterDraft()"
          >
            Save Draft
          </button>

          <button
            type="button"
            class="btn-print"
            onclick="printNewsletter()"
          >
            Print
          </button>
        </div>
      </section>

      <section id="nl-page">
        <div class="nl-placeholder">
          Complete the form and select “Generate Newsletter.”
        </div>
      </section>
    </section>
  </main>
</body>
</html>
